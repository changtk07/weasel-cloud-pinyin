# Google cloud pinyin on top of rime-ice.
# Part of Yunpin (雲拼), installed by its scripts/deploy.sh. Edit the copy in the Yunpin repo, not here.
patch:
  # Right before script_translator (index 1 in rime-ice): librime compares each
  # translator only with the next one, so Google must sit next to the dictionary.
  engine/translators/@before 1: lua_translator@*cloud_pinyin
  # Keeps dates, English and custom phrases where rime-ice ranks them.
  engine/filters/@before 0: lua_filter@*cloud_pinyin*filter
  # ' between syllables in the input box (w'm), like Microsoft Pinyin. Remove
  # this line for rime-ice's spaces. Before uniquifier, which has to stay last:
  # a Lua filter after it reads ahead, and duplicates get through.
  engine/filters/@before last: lua_filter@*cloud_pinyin*apostrophes
  cloud_pinyin:
    timeout_ms: 200   # wait at most this long for Google, then show local candidates only
    count: 5          # cloud candidates per request
    comment: "☁"      # marks cloud candidates; "" for none
    learn: true       # add picked cloud candidates to the user dictionary for offline use
    rank: blend       # rank Google's and the dictionary's candidates together; "cloud" puts Google's first
    blend_k: 2        # blend: lower favors each list's first candidates, higher favors ones both suggest
    cloud_weight: 1   # blend: weight of Google's ranking; the dictionary's is 1
    used_first: true  # blend: words you've picked come first, as RIME does offline
  menu/page_size: 9   # like the Windows 11 IME
  # Name the punctuation switch in the F4 menu (rime-ice shows ¥ → $).
  # Ctrl+Shift+3 toggles it.
  switches/@1/states: ["中文標點", "英文標點"]
  switches/@1/abbrev: ["。", "."]
  # Punctuation after a digit is full-width like anywhere else. rime-ice keeps
  # , . : half-width there until the next key (3.1, or 3。 by pressing . twice).
  punctuator/digit_separators: ""
  # 繁: Taiwan character forms (裡, 為, 著), mainland vocabulary kept (軟件 stays 軟件).
  traditionalize/opencc_config: s2tw.json
